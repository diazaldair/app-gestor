# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Forzar descarga de Kotlin Native desde Maven para evitar fallos de CDN
kotlin.native.distribution.downloadFromMaven=true
# Ignorar targets que no pueden compilarse en este host (ej. iOS en Windows)
kotlin.native.ignoreDisabledTargets=true
# Evitar que fallos de commonización detengan el build si no son críticos
kotlin.mpp.enableNativeCompilerDownloading=true

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# Deshabilitamos temporalmente para diagnosticar errores de aislamiento de plugins
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Compatibilidad obligatoria para AGP 9+ con Kotlin Multiplatform
android.builtInKotlin=false
android.newDsl=false
